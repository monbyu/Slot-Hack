        .btn-auto-tg:hover { opacity: 0.9; }

<script>
    // Copy Username Function
    function copyTgUsername() {
        const username = "@slot24556";
        navigator.clipboard.writeText(username).then(() => {
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerText = "ကူးပြီးပါပြီ!";
            copyBtn.style.background = "#27ae60";
            setTimeout(() => {
                copyBtn.innerText = "Copy ကူးမည်";
                copyBtn.style.background = "#34495e";
            }, 2000);
        }).catch(err => {
            alert("Copy ကူးယူခြင်း: @slot24556");
        });
    }

    // User Authentication Logic
    let isRegisterMode = true;
    let savedUser = null;

    function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        const nameInput = document.getElementById('regName');
        const header = document.getElementById('authHeader');
        const btn = document.getElementById('authSubmitBtn');
        const toggleText = document.getElementById('authToggle');

        if (isRegisterMode) {
            header.innerText = "အကောင့်သစ်ဖွင့်ရန်";
            btn.innerText = "အကောင့်ဖွင့်မည်";
            nameInput.style.display = "block";
            toggleText.innerText = "အကောင့်ရှိပြီးသားဖြစ်ပါက Login ဝင်ရန် နှိပ်ပါ";
        } else {
            header.innerText = "Login ဝင်ရန်";
            btn.innerText = "Login ဝင်မည်";
            nameInput.style.display = "none";
            toggleText.innerText = "အကောင့်သစ်ဖွင့်လိုပါက ဤနေရာကို နှိပ်ပါ";
        }
    }

    function handleAuth() {
        const name = document.getElementById('regName').value.trim();
        const id = document.getElementById('regId').value.trim();
        const pw = document.getElementById('regPw').value.trim();

        if (id.length !== 5) {
            alert("ID နံပါတ်သည် ဂဏန်း/စာလုံး (၅) လုံး အတိအကျ ဖြစ်ရပါမည်။");
            return;
        }

        if (pw.length !== 6) {
            alert("စကားဝှက် (Password) သည် (၆) လုံး အတိအကျ ဖြစ်ရပါမည်။");
            return;
        }

        if (isRegisterMode) {
            if (!name) {
                alert("ကျေးဇူးပြု၍ အမည် ဖြည့်သွင်းပါ။");
                return;
            }
            savedUser = { name, id, pw };
            alert("အကောင့်ဖွင့်ခြင်း အောင်မြင်ပါသည်။ ဂိမ်းထဲသို့ ဝင်ရောက်နေပါသည်။");
        } else {
            if (savedUser && savedUser.id !== id && savedUser.pw !== pw) {
                alert("ID သို့မဟုတ် စကားဝှက် မှားယွင်းနေပါသည်။");
                return;
            }
            savedUser = { name: "Player", id, pw };
        }

        document.getElementById('authBox').style.display = "none";
        document.getElementById('gameBox').style.display = "flex";
        document.getElementById('displayUser').innerText = id;
    }

    // Dynamic Payment Info Handler
    function updatePayInfo() {
        if (currentMode !== 'deposit') return;
        const method = document.getElementById('payMethod').value;
        const adminInfoBox = document.getElementById('adminInfoBox');

        if (method === 'KBZPay') {
            adminInfoBox.innerHTML = 'ငွေလွှဲရမည့် KBZPay နံပါတ်: <span style="color:#fff;">09449039990</span>';
        } else {
            adminInfoBox.innerHTML = 'ငွေလွှဲရမည့် WavePay နံပါတ်: <span style="color:#fff;">09894078044</span>';
        }
    }

    // Audio Context
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSpinSound() {
        initAudio();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    function playWinSound() {
        initAudio();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, index) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.1 + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + index * 0.1);
            osc.stop(audioCtx.currentTime + index * 0.1 + 0.2);
        });
    }

    function playBigWinSound() {
        initAudio();
        const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51];
        notes.forEach((freq, index) => {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime + index * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + index * 0.08);
            osc.stop(audioCtx.currentTime + index * 0.08 + 0.3);
        });
    }

    function playCashSound() {
        initAudio();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1318.51, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
    }

    const buffaloSym = '<svg viewBox="0 0 100 100"><use href="#icon-buffalo"/></svg>';
    const deerSym = '<svg viewBox="0 0 100 100"><use href="#icon-deer"/></svg>';
    const elephantSym = '<svg viewBox="0 0 100 100"><use href="#icon-elephant"/></svg>';
    const zebraSym = '<svg viewBox="0 0 100 100"><use href="#icon-zebra"/></svg>';

    const symbols = [
        '<span class="sym-text sym-9">9</span>',
        '<span class="sym-text sym-10">10</span>',
        '<span class="sym-text sym-J">J</span>',
        '<span class="sym-text sym-Q">Q</span>',
        '<span class="sym-text sym-K">K</span>',
        '<span class="sym-text sym-A">A</span>',
        buffaloSym, deerSym, elephantSym, zebraSym
    ];

    let balance = 0; 
    let bet = 100;
    let currentMode = '';

    function initRandomReels() {
        const reelsBox = document.getElementById('reelsBox');
        reelsBox.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            let reelHtml = `<div class="reel">`;
            for (let j = 0; j < 4; j++) {
                let randomSym = symbols[Math.floor(Math.random() * symbols.length)];
                reelHtml += `<div class="symbol">${randomSym}</div>`;
            }
            reelHtml += `</div>`;
            reelsBox.innerHTML += reelHtml;
        }
    }

    function setWinReels(winSymbol) {
        const reelsBox = document.getElementById('reelsBox');
        reelsBox.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            let reelHtml = `<div class="reel">`;
            for (let j = 0; j < 4; j++) {
                let currentSym = (j === 1) ? winSymbol : symbols[Math.floor(Math.random() * symbols.length)];
                reelHtml += `<div class="symbol">${currentSym}</div>`;
            }
            reelHtml += `</div>`;
            reelsBox.innerHTML += reelHtml;
        }
    }

    initRandomReels();

    function changeBet(val) {
        if (bet + val >= 100 && bet + val <= 50000) {
            bet += val;
            document.getElementById('betVal').innerText = bet;
        }
    }

    function spinReels() {
        if (balance < bet) {
            alert('လက်ကျန်ငွေ မလုံလောက်ပါ။ ကျေးဇူးပြု၍ ငွေဖြည့်သွင်းပေးပါ။');
            toggleForm('deposit');
            document.getElementById('bankingSection').scrollIntoView({ behavior: 'smooth' });
            return;
        }

        balance -= bet;
        document.getElementById('userBalance').innerText = balance;
        document.getElementById('winAmount').innerText = '0';
        
        const spinBtn = document.getElementById('spinBtn');
        spinBtn.disabled = true;
        spinBtn.innerText = '...';

        let counter = 0;
        let spinInterval = setInterval(() => {
            initRandomReels();
            playSpinSound();
            counter++;
            if (counter > 10) {
                clearInterval(spinInterval);
                spinBtn.disabled = false;
                spinBtn.innerText = 'SPIN';
                processDynamicWin();
            }
        }, 80);
    }

    function processDynamicWin() {
        let chance = Math.random();

        if (chance < 0.30) {
            initRandomReels();
            document.getElementById('winAmount').innerText = '0';
        } else {
            let multipliers = [2, 3, 5, 8, 10, 15];
            let selectedMultiplier = multipliers[Math.floor(Math.random() * multipliers.length)];
            
            let winVal = bet * selectedMultiplier;
            balance += winVal;
            
            let winSym = buffaloSym;
            if (selectedMultiplier <= 3) winSym = deerSym;
            else if (selectedMultiplier <= 5) winSym = elephantSym;

            setWinReels(winSym);

            document.getElementById('userBalance').innerText = balance;
            document.getElementById('winAmount').innerText = winVal;

            if (selectedMultiplier >= 8) {
                playBigWinSound();
            } else {
                playWinSound();
            }

            setTimeout(() => {
                alert(` ဂုဏ်ယူပါတယ်! (${selectedMultiplier} ဆ) အဖြစ် ${winVal} Ks အနိုင်ရရှိပါသည်။`);
            }, 100);
        }
    }

    function toggleForm(mode) {
        currentMode = mode;
        const form = document.getElementById('bankForm');
        const title = document.getElementById('formTitle');
        const transIdInput = document.getElementById('transId');
        const adminInfoBox = document.getElementById('adminInfoBox');
        const userPayPhone = document.getElementById('userPayPhone');
        const transAmount = document.getElementById('transAmount');
        
        form.style.display = 'flex';
        
        if (mode === 'deposit') {
            title.innerText = 'ငွေသွင်းရန် လျှောက်ထားခြင်း';
            adminInfoBox.style.display = 'block';
            userPayPhone.style.display = 'none';
            transIdInput.style.display = 'block';
            transAmount.placeholder = 'သွင်းလိုသည့် ပမာဏ (အနည်းဆုံး ၅,၀၀၀ ကျပ်)';
            updatePayInfo();
        } else {
            title.innerText = 'ငွေထုတ်ရန် လျှောက်ထားခြင်း';
            adminInfoBox.style.display = 'none';
            userPayPhone.style.display = 'block';
            transIdInput.style.display = 'none';
            transAmount.placeholder = 'ထုတ်ယူလိုသည့် ပမာဏ (အနည်းဆုံး ၁၀,၀၀၀ ကျပ်)';
        }
    }

    function submitTransaction() {
        const amountVal = document.getElementById('transAmount').value;
        const amount = parseInt(amountVal);
        const method = document.getElementById('payMethod').value;
        const transId = document.getElementById('transId').value.trim();
        const userPhone = document.getElementById('userPayPhone').value.trim();

        if (!amountVal || isNaN(amount)) {
            alert('ကျေးဇူးပြု၍ ပမာဏ ဖြည့်သွင်းပေးပါ။');
            return;
        }

        if (currentMode === 'deposit') {
            if (amount < 5000) {
                alert('ငွေသွင်းပမာဏသည် အနည်းဆုံး ၅,၀၀၀ ကျပ် ဖြစ်ရပါမည်။');
                return;
            }
            if (transId.length !== 5) {
                alert('ပြေစာ ID နံပါတ်သည် နောက်ဆုံး (၅) လုံး အတိအကျ ဖြစ်ရပါမည်။');
                return;
            }

            if (transId === "68610") {
                playCashSound();
                balance += amount;
                alert(` ${method} ပြေစာ ID (68610) စစ်ဆေးအောင်မြင်ပါသည်။ ${amount} Ks အကောင့်ထဲသို့ အလိုအလျောက် ဝင်သွားပါပြီ။`);
            } else {
                alert(` ${method} ဖြင့် ${amount} Ks ငွေသွင်းခြင်း တင်ပြထားပါသည်။ (ပြေစာ ID: ${transId}) Admin စစ်ဆေးပြီးပါက အကောင့်ထဲသို့ ငွေဝင်ရောက်မည်ဖြစ်ပါသည်။`);
            }
        } else {
            if (amount < 10000) {
                alert('ငွေထုတ်ပမာဏသည် အနည်းဆုံး ၁၀,၀၀၀ ကျပ် ဖြစ်ရပါမည်။');
                return;
            }
            if (!userPhone) {
                alert('ကျေးဇူးပြု၍ ထုတ်ယူမည့် ဖုန်းနံပါတ်/အကောင့်နံပါတ် ဖြည့်ပေးပါ။');
                return;
            }
            if (amount > balance) {
                alert('ထုတ်ယူလိုသော ပမာဏသည် လက်ကျန်ငွေထက် များနေပါသည်။');
                return;
            }
            playCashSound();
            balance -= amount;
            alert(`${method} အကောင့် (${userPhone}) သို့ ${amount} Ks ငွေထုတ်ယူခြင်း တင်ပြပြီးပါပြီ။`);
        }

        document.getElementById('userBalance').innerText = balance;
        document.getElementById('bankForm').style.display = 'none';
        document.getElementById('transAmount').value = '';
        document.getElementById('transId').value = '';
        document.getElementById('userPayPhone').value = '';
    }
</script>
